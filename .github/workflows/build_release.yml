name: Build OmniReader (Android & Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Phien ban release (vi du: v0.1.3)'
        required: false
        default: 'v0.1.3'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
      - name: Ensure Android platform and disable Kotlin script compile avoidance conflict
        run: |
          if [ ! -d "android" ]; then flutter create --platforms=android --project-name omni_reader .; fi
          mkdir -p ~/.gradle
          echo "org.gradle.kotlin.dsl.compileAvoidance=false" >> ~/.gradle/gradle.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Rename Android APK to App Name and Version
        run: |
          TAG_NAME="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG_NAME" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG_NAME="${{ github.ref_name }}"
            else
              TAG_NAME="v0.1.3"
            fi
          fi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/OmniReader-${TAG_NAME}-android.apk"
          echo "APK_PATH=dist/OmniReader-${TAG_NAME}-android.apk" >> $GITHUB_ENV
          echo "RELEASE_TAG=${TAG_NAME}" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: OmniReader-Android-APK
          path: ${{ env.APK_PATH }}
      - name: Publish Android APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: OmniReader ${{ env.RELEASE_TAG }}
          files: ${{ env.APK_PATH }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
      - name: Prepare Windows platform and build via detected VS generator
        shell: pwsh
        run: |
          if (-not (Test-Path "windows")) { flutter create --platforms=windows --project-name omni_reader . }
          flutter pub get

          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $gen = "Visual Studio 17 2022"
          $vsPath = $null
          if (Test-Path $vsWhere) {
            $ver = & $vsWhere -latest -property installationVersion
            $vsPath = & $vsWhere -latest -property installationPath
            if ($ver -match "^18\.") { $gen = "Visual Studio 18 2026" }
          }

          $buildDir = Join-Path (Get-Location) "build\windows\x64"
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null

          $cmakeExe = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio","${env:ProgramFiles(x86)}\Microsoft Visual Studio" -Recurse -Filter "cmake.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $cmakeExe) {
            $cmakeCmd = Get-Command cmake -ErrorAction SilentlyContinue
            if ($cmakeCmd) { $cmakeExe = $cmakeCmd.Source }
          }

          $devCmd = $null
          if ($vsPath) {
            $candidateDevCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
            if (Test-Path $candidateDevCmd) { $devCmd = $candidateDevCmd }
          }

          $sourceDir = Join-Path (Get-Location) "windows"
          if ($devCmd -and $cmakeExe) {
            $cmdScript = @"
@echo off
call "$devCmd" -arch=x64 -host_arch=x64
"$cmakeExe" -S "$sourceDir" -B "$buildDir" -G "$gen" -A x64 -DFLUTTER_TARGET_PLATFORM=windows-x64
"$cmakeExe" --build "$buildDir" --config Release --target omni_reader
"@
            $batFile = Join-Path (Get-Location) "run_win_build.bat"
            Set-Content -Path $batFile -Value $cmdScript -Encoding ASCII
            cmd /c "`"$batFile`""
            if ($LASTEXITCODE -ne 0) { throw "CMake/MSBuild Windows failed with code $LASTEXITCODE" }
          } else {
            flutter build windows --release
          }
      - name: Package Windows release with App Name and Version
        shell: pwsh
        run: |
          $tagName = "${{ github.event.inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tagName)) {
            if ("${{ github.ref }}".StartsWith("refs/tags/")) {
              $tagName = "${{ github.ref_name }}"
            } else {
              $tagName = "v0.1.3"
            }
          }
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            $releaseDir = "build\windows\x64\Release"
          }
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          $zipOut = "dist\OmniReader-$tagName-windows-x64.zip"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipOut -Force
          "WIN_ZIP_PATH=$zipOut" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=$tagName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: OmniReader-Windows-x64
          path: ${{ env.WIN_ZIP_PATH }}
      - name: Publish Windows Zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: OmniReader ${{ env.RELEASE_TAG }}
          files: ${{ env.WIN_ZIP_PATH }}
