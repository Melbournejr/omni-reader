name: Build Android & Windows

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
      - name: Ensure Android platform and disable Kotlin script compile avoidance conflict
        run: |
          if [ ! -d "android" ]; then flutter create --platforms=android --project-name omni_reader .; fi
          mkdir -p ~/.gradle
          echo "org.gradle.kotlin.dsl.compileAvoidance=false" >> ~/.gradle/gradle.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: omni-reader-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish Android APK to Release on tag push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
      - name: Ensure Windows platform and set CMake generator
        shell: pwsh
        run: |
          if (-not (Test-Path "windows")) { flutter create --platforms=windows --project-name omni_reader . }
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $gen = "Visual Studio 17 2022"
          if (Test-Path $vsWhere) {
            $ver = & $vsWhere -latest -property installationVersion
            if ($ver -match "^18\.") { $gen = "Visual Studio 18 2026" }
          }
          "CMAKE_GENERATOR=$gen" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip Windows Release
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "omni-reader-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: omni-reader-windows-release
          path: omni-reader-windows-x64.zip
      - name: Publish Windows Zip to Release on tag push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: omni-reader-windows-x64.zip
