name: Build Multi-Platform Reader

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
      - name: Ensure Android platform and disable Kotlin script compile avoidance conflict
        run: |
          if [ ! -d "android" ]; then flutter create --platforms=android --project-name omni_reader .; fi
          mkdir -p ~/.gradle
          echo "org.gradle.kotlin.dsl.compileAvoidance=false" >> ~/.gradle/gradle.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: omni-reader-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
      - name: Ensure Windows platform and configure CMake generator for installed VS
        run: |
          if (-not (Test-Path "windows")) { flutter create --platforms=windows --project-name omni_reader . }
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $gen = "Visual Studio 17 2022"
          if (Test-Path $vsWhere) {
            $ver = & $vsWhere -latest -property installationVersion
            if ($ver -match "^18\.") { $gen = "Visual Studio 18 2026" }
          }
          $cmakeDir = "D:\a\omni-reader\omni-reader\windows\cmake-shim"
          New-Item -ItemType Directory -Path $cmakeDir -Force | Out-Null
          $realCmake = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter "cmake.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $realCmake) {
            $realCmake = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio" -Recurse -Filter "cmake.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if ($realCmake) {
            @"
@echo off
setlocal enabledelayedexpansion
set "ARGS=%*"
set "ARGS=!ARGS:-G Visual Studio 16 2019=-G "$gen"!"
"$realCmake" !ARGS!
"@ | Set-Content -Path "$cmakeDir\cmake.exe" -Encoding ASCII
            $env:PATH = "$cmakeDir;$env:PATH"
          }
        shell: pwsh
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: omni-reader-windows-release
          path: build/windows/x64/runner/Release/
